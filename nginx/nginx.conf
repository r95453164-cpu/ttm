# Nginx Configuration for TikTok Custom (ttm)

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # FastAPI Backend
    server {
        listen       80;
        server_name  api.ttm.local;

        location / {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # RU Connectivity: Health check
            location /api/v1/health {
                proxy_pass http://backend:8000/api/v1/health;
            }
        }

        # Admin Panel (React)
        location /admin/ {
            proxy_pass http://admin:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Static Content / Emojis (from S3/MinIO)
        location /storage/ {
            proxy_pass http://minio:9000;
            proxy_set_header Host $host;
        }
    }

    # SSL configuration (placeholder for production)
    # server {
    #     listen       443 ssl;
    #     server_name  api.ttm.local;
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ...
    # }
}
